# \ud83d\udee1\ufe0f Secure Password Generator & Evaluator (Java)

A robust, cryptographically secure password generator and dynamic strength evaluator built using **Java**. This project demonstrates clean code architecture, design patterns, object-oriented programming (OOP) principles, and cryptographic security fundamentals.

---

## \u2728 Features

* **Cryptographically Secure Randomness:** Uses `java.security.SecureRandom` to ensure high unpredictability and resist brute-force attacks.
* **Flexible Builder Pattern:** Allows full customization of password rules (length, uppercase, lowercase, digits, special characters, and exclusion of visually similar characters like `1`, `l`, `O`, `0`).
* **Dynamic Entropy & Strength Calculation:** Evaluates password strength scientifically using Information Theory:
  $$E = L \times \log_2(R)$$
  * $E$: Entropy in Bits
  * $L$: Password Length
  * $R$: Dynamic Character Pool Size
* **Clean Code & Defensive Programming:** Built with immutability, fail-fast validations, modular package architecture, and interactive CLI handling.

---

